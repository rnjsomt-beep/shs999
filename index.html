<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4Q_자재수불부_v3</title>
<style>
:root{
  --bg:#ffffff; --chrome:#f3f4f6; --chrome2:#e6e8ec; --line:#d9dce1; --head:#eff1f4;
  --fg:#1f2328; --muted:#7a818c; --accent:#2f6fb2; --sel:#e3edf9;
  --in:#1d5fa8; --out:#b4302a; --hold:#2f7d46;
  --ui:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --num:"Consolas","D2Coding",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:11px/1.2 var(--ui);display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--chrome);border-bottom:1px solid var(--line);padding-inline:8px}
.title{display:flex;gap:8px;align-items:baseline;padding-block:3px 1px;white-space:nowrap;overflow:hidden}
.doc{font-size:12px}
.menu{display:flex;gap:1px;flex-wrap:wrap;color:var(--muted)}
.menu span{padding:1px 5px;cursor:default}
.fbar{display:flex;border-top:1px solid var(--line);margin-inline:-8px;padding-inline:8px;background:var(--bg)}
.ref{width:44px;border-right:1px solid var(--line);padding:2px 4px;font-family:var(--num);color:var(--muted)}
.fx{padding:2px 6px;color:var(--muted);font-style:italic}
.formula{padding:2px 4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--num)}
.formula.err{color:var(--out)}
.wrap{flex:1;min-height:0;overflow:auto}
table.grid{border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.grid th,.grid td{border:1px solid var(--line);height:17px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid thead th{position:sticky;top:0;background:var(--head);color:var(--muted);font-weight:400;z-index:2}
.grid tbody th{position:sticky;left:0;background:var(--head);color:var(--muted);font-weight:400;text-align:center;z-index:1}
.grid thead th:first-child{left:0;z-index:3}
.n{text-align:right;font-family:var(--num)}
.c{text-align:center}
.h{background:var(--head);color:var(--muted)}
.b{font-weight:700}
.m{color:var(--muted)}
.me{background:var(--sel)}
.in{color:var(--in)} .out{color:var(--out)} .hold{color:var(--hold)}
.red{color:var(--out)}
.cur{outline:2px solid var(--accent);outline-offset:-2px}
.new{animation:flash 1.4s ease-out}
@keyframes flash{from{background:var(--sel)}to{background:transparent}}
.grid td.btn{padding:0}
.grid td.btn button{width:100%;height:100%;font:inherit;color:var(--fg);background:var(--chrome);border:0;cursor:pointer;padding:0}
.grid td.btn button:hover{background:var(--chrome2)}
.grid td.btn button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.grid td.btn button[aria-pressed="true"]{background:var(--sel);color:var(--accent);font-weight:700}
.grid td.btn.in button{color:var(--in)} .grid td.btn.out button,.grid td.btn.red button{color:var(--out)} .grid td.btn.hold button{color:var(--hold)}
.grid td.btn.num button{background:var(--bg)}
.grid td.btn.num button[aria-pressed="true"]{background:var(--sel)}
.grid td input{width:100%;border:0;background:transparent;color:var(--fg);font:inherit;padding:0;height:15px}
.grid td input:focus{outline:none}
.grid td.btn .bx{display:flex;height:100%}.grid td.btn .bx button{flex:1;border-left:1px solid var(--line)}
.grid td.adm{background:var(--sel)}
.grid td:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
.road span{margin-left:3px;font-weight:600}
.cards span+span{margin-left:4px}
.tabs{display:flex;background:var(--chrome);border-top:1px solid var(--line);padding-inline:8px;overflow-x:auto}
.tabs button{font:inherit;color:var(--muted);background:transparent;border:0;border-right:1px solid var(--line);padding:3px 10px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--accent);font-weight:600}
.status{display:flex;gap:12px;justify-content:space-between;background:var(--chrome);border-top:1px solid var(--line);padding:2px 8px calc(2px + env(safe-area-inset-bottom,0px));color:var(--muted)}
.status .r{display:flex;gap:12px;font-variant-numeric:tabular-nums}
.grid td.spin,.grid td.spin button{background:var(--accent);color:#fff;font-weight:700}
.toasts{position:fixed;right:10px;bottom:calc(34px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:20;pointer-events:none}
.toast{pointer-events:auto;cursor:pointer;background:#2b2f36;color:#fff;border-left:4px solid var(--accent);border-radius:3px;padding:7px 12px;font-size:12px;line-height:1.35;max-width:min(92vw,440px);box-shadow:0 3px 12px rgba(0,0,0,.28);animation:tin .22s ease-out}
.toast b{font-weight:700}
.toast .tag{display:block;margin-top:2px;font-size:11px;color:#c7ccd4}
.toast.allin{border-left-color:#e3a008}
.toast.big{border-left-color:#2f9e55}
.toast.jackpot{border-left-color:#e5484d;background:#3a2326}
.toast.special{border-left-color:#8b6fd6}
.toast.fail{border-left-color:#868e96;background:#26292e}
.toast.die{border-left-color:#e5484d;background:#1d1f23}
.toast.join{border-left-color:#4c8bf5}

/* stocks */
canvas.sp{display:block;width:100%;height:15px}
.grid td.fu{animation:fu .7s}.grid td.fd{animation:fd .7s}@keyframes fu{from{background:#ffe1e1}}@keyframes fd{from{background:#dde9ff}}
#felt.dark{background:radial-gradient(ellipse at 50% 0,#1d2533,#0d1118 70%);color:#e8ecf1}
.f-in.sk-in{max-width:980px}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sk-card{background:#151c27;border:1px solid #263042;border-radius:10px;padding:7px 9px;cursor:pointer;position:relative}
.sk-card.on{border-color:#ffd43b;box-shadow:0 0 0 1px #ffd43b}
.sk-card .tk{color:#7d8899;font:10px var(--num);margin-left:4px}.sk-card .px{font:700 19px var(--num);margin-top:2px}.sk-card .ch{font:12px var(--num)}
.sk-card canvas{width:100%;height:40px;display:block;margin-top:4px}
.sk-card .mine{position:absolute;right:7px;top:7px;font-size:10px;background:#ffd43b;color:#111;border-radius:8px;padding:0 6px;font-weight:700}
.sk-card.u .px,.sk-card.u .ch,#felt .u{color:#ff6b6b}.sk-card.d .px,.sk-card.d .ch,#felt .d{color:#6aa8ff}
.sk-card.pu{animation:pu .5s}.sk-card.pd{animation:pd .5s}@keyframes pu{from{background:#3a1d22}}@keyframes pd{from{background:#1b2a44}}
.sk-two{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
@media (max-width:760px){.sk-two{grid-template-columns:1fr}}
.sk-panel{background:#151c27;border:1px solid #263042;border-radius:10px;padding:9px 11px}
.sk-panel h4{margin:8px 0 4px;font-size:12px;color:#9aa6b8;font-weight:600}.sk-panel h4:first-child{margin-top:0}
.sk-big{display:flex;gap:10px;align-items:baseline}.sk-big b{font-size:16px}.sk-big .px{font:700 24px var(--num)}
.sk-chart{width:100%;height:130px;display:block;margin:4px 0}
.sk-amts{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.sk-amts button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:5px 8px;cursor:pointer;background:#273246;color:#dbe3ee}
.sk-amts button[aria-pressed="true"]{background:#ffd43b;color:#111}
.sk-m{color:#9aa6b8;font-size:11px}
.sk-bs{display:flex;gap:8px;margin-top:6px}.sk-bs button{flex:1;font:700 15px var(--ui);border:0;border-radius:8px;padding:10px;cursor:pointer;color:#fff}
.sk-bs .buy{background:linear-gradient(#e5484d,#c22f35)}.sk-bs .sell{background:linear-gradient(#3b82f6,#1d5fd0)}
.sk-kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-family:var(--num)}.sk-kv span:nth-child(odd){color:#8e9aac;font-family:var(--ui)}.sk-kv span:nth-child(even){text-align:right}
.sk-hold{width:100%;border-collapse:collapse;font:11px var(--num)}.sk-hold td,.sk-hold th{padding:3px 3px;border-bottom:1px solid #222b3b;text-align:right;white-space:nowrap}
.sk-hold th{color:#7d8899;font-weight:400;font-family:var(--ui)}.sk-hold td:first-child,.sk-hold th:first-child{text-align:left;font-family:var(--ui)}
.sk-hold .btns button{font:700 11px var(--ui);border:0;border-radius:4px;padding:3px 6px;margin-left:3px;cursor:pointer;color:#fff}
.sk-hold .btns .b{background:#c22f35}.sk-hold .btns .s{background:#1d5fd0}
.sk-oth,.sk-log div{font-size:11px;padding:2px 0;border-bottom:1px dashed #222b3b;color:#b9c3d1}.sk-log{max-height:150px;overflow:auto}
/* mini games, table mode */
.f-in.mg-in{max-width:620px;align-items:center}
.mg-seats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.mg-seats button{font:inherit;font-weight:700;border:2px solid transparent;border-radius:16px;padding:5px 13px;cursor:pointer;background:rgba(0,0,0,.3);color:#fff}
.mg-seats .me{border-color:#ffd43b}.mg-seats .turn{background:#ffd43b;color:#111}.mg-seats .new{background:#f3f3f3;color:#111}
.mg-board{margin:4px auto;user-select:none;-webkit-user-select:none}
.mg-hint{text-align:center;color:#e9f5ec;font-size:12px}
.mg-ch{display:grid;grid-template-columns:repeat(8,40px);border:4px solid #5a3a1a;border-radius:4px}
.mg-ch .sq{width:40px;height:40px;border:0;padding:0;font:30px/40px "Segoe UI Symbol","Noto Sans Symbols",serif;cursor:pointer}
.mg-ch .lt{background:#f0d9b5}.mg-ch .dk{background:#b58863}.mg-ch .w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}.mg-ch .b{color:#111}
.mg-ch .last{box-shadow:inset 0 0 0 3px rgba(255,212,59,.65)}.mg-ch .sel{box-shadow:inset 0 0 0 3px #ffd43b}
.mg-ch .mv{background-image:radial-gradient(circle,rgba(0,0,0,.3) 18%,transparent 20%)}
.mg-om{display:grid;grid-template-columns:repeat(15,24px);background:#dcb35c;padding:6px;border-radius:4px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.mg-om .pt{width:24px;height:24px;border:0;padding:0;cursor:pointer;position:relative;background:linear-gradient(#6b4e24,#6b4e24) center/1px 100% no-repeat,linear-gradient(#6b4e24,#6b4e24) center/100% 1px no-repeat}
.mg-om .s1::after,.mg-om .s2::after{content:"";position:absolute;inset:2px;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.mg-om .s1::after{background:radial-gradient(circle at 35% 35%,#666,#000)}.mg-om .s2::after{background:radial-gradient(circle at 35% 35%,#fff,#c4c4c4)}
.mg-om .last::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#e5484d;z-index:1}
.mg-c4{display:grid;grid-template-columns:repeat(7,44px);gap:4px;background:#1d4fbf;padding:8px;border-radius:10px}
.mg-c4 .hole{width:44px;height:44px;border-radius:50%;border:0;padding:0;background:#0c2a66;cursor:pointer;box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
.mg-c4 .s1{background:radial-gradient(circle at 35% 35%,#ff6b6b,#c0191f)}.mg-c4 .s2{background:radial-gradient(circle at 35% 35%,#ffe066,#e0a800)}
.mg-c4 .last{outline:3px solid #fff;outline-offset:-3px}
.mg-tw{position:relative;width:336px;height:230px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden;cursor:pointer}
.mg-tw .blk{position:absolute;height:15px;border-radius:2px;background:linear-gradient(#ffd43b,#e0a800)}.mg-tw .blk.mv{background:linear-gradient(#ff8787,#e5484d)}
/* bet tools: % of balance, drag slider, previous bet */
.grid td.btn .btools{display:flex;align-items:center;gap:0;height:100%}.grid td.btn .btools button{flex:none;width:auto;min-width:40px;padding:0 8px;border-left:1px solid var(--line)}.grid td.btn .btools button:first-child{border-left:0}
.btools input[type=range]{width:120px;height:12px;margin:0 6px;accent-color:var(--accent);cursor:pointer}.btools .pl{min-width:96px;font-size:11px;color:#555;white-space:nowrap}
.btools button[disabled]{opacity:.45;cursor:default}
#felt .btools{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}#felt .btools button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;background:#f3f3f3;color:#111}
#felt .btools button[aria-pressed="true"]{background:#ffd43b}#felt .btools .pl{color:#e9f5ec}
.chip.c5{background:#7b2cbf}
/* 다이아 5+ entrance */
.toast.vip{--vc:#5b8def;position:relative;overflow:hidden;border-left:0;padding:10px 16px 10px 14px;font-size:14px;background:linear-gradient(135deg,#141b33,#22305c);box-shadow:0 0 0 1px var(--vc),0 0 22px color-mix(in srgb,var(--vc) 70%,transparent);animation:tin .3s,vipglow 1.4s ease-in-out .3s infinite alternate}
.toast.vip.v-ma{--vc:#a45ee5;background:linear-gradient(135deg,#1f1433,#3a2160)}.toast.vip.v-gm{--vc:#ff5a5f;background:linear-gradient(135deg,#2e1214,#5c1f24)}.toast.vip.v-ch{--vc:#f0b429;background:linear-gradient(135deg,#2b220c,#5c4510)}
.toast.vip .vb{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--vc);margin-bottom:2px}
.toast.vip::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-100%);animation:vipshine 2.4s ease-in-out .4s infinite;pointer-events:none}
@keyframes vipglow{to{box-shadow:0 0 0 2px var(--vc),0 0 34px var(--vc)}}
@keyframes vipshine{60%,100%{transform:translateX(100%)}}
.vipban{position:fixed;left:50%;top:70px;z-index:30;transform:translate(-50%,-30px);opacity:0;pointer-events:none;padding:14px 34px;border-radius:10px;font:700 20px var(--ui);color:#fff;text-align:center;white-space:nowrap;background:linear-gradient(135deg,#2b220c,#6b5013);box-shadow:0 0 0 2px var(--vc,#f0b429),0 0 40px var(--vc,#f0b429);animation:vipban 4.2s ease forwards}
.vipban small{display:block;font-size:12px;letter-spacing:2px;color:var(--vc,#f0b429)}
@keyframes vipban{8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
@media (prefers-reduced-motion:reduce){.toast.vip,.toast.vip::after,.vipban{animation:none;opacity:1}}
.t-br{color:#b0703c} .t-si{color:#6f7b87} .t-go{color:#d4a017} .t-pl{color:#2bb3a3} .t-em{color:#2f9e55}
.t-di{color:#5b8def} .t-ma{color:#a45ee5} .t-gm{color:#e5484d} .t-ch{color:#f0b429;font-weight:700}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.new{animation:none}.toast{animation:none}}
.chat{background:var(--bg);border-top:1px solid var(--line);padding:2px 8px}
.chat[hidden]{display:none}
.chat .cl{height:64px;overflow-y:auto;font-size:11px;line-height:16px}
.chat .cl .big{font-size:15px;line-height:20px}
.chat .cb{display:flex;gap:4px;align-items:center;border-top:1px solid var(--line);padding-top:2px;margin-top:2px}
.chat input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:2px 4px;height:19px}
.chat .emo button{font-size:12px;padding:0 3px;height:19px;border:1px solid var(--line);background:var(--chrome);cursor:pointer}
.chat .emo button:hover{background:var(--chrome2)}
.pc button{font-weight:700;font-family:var(--num)}
.grid td.tb{background:var(--accent);color:#fff;font-weight:700}
.tb{background:var(--accent)}.tb2{background:#8fb3dc}
.grid td.twc{cursor:pointer;background:var(--chrome);user-select:none}
.grid td.ch{height:32px}
.ch button{font-size:24px;line-height:1;font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",var(--ui)}
.pop{position:fixed;left:50%;top:38%;font-size:72px;z-index:30;pointer-events:none;transform:translate(-50%,-50%);animation:pp 1.3s ease-out forwards}
@keyframes pp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.grid td.t5,.grid td.t5 button{background:var(--accent);color:#fff;font-weight:700}
.grid td.rfire,.grid td.rfire button{background:#f59f00!important;color:#111!important;font-weight:700}
.grid td.rstun,.grid td.rstun button{background:#8a8f98!important;color:#fff!important}
.grid td.rhit{background:#e5484d;color:#fff}
.grid td.rkill{background:#ffd43b}
.grid td.rodd{background:#f08c00;color:#fff}
.grid td.rbossc{background:#7a1018;color:#fff;font-weight:700}
.grid td.rboss{color:#fff;font-weight:700}
.grid td.rwarn{animation:rw .6s steps(2) infinite}
@keyframes rw{50%{background:#e5484d;color:#fff}}
@media (prefers-reduced-motion:reduce){.grid td.rwarn{animation:none}}
.grid td.cb{background:repeating-linear-gradient(45deg,#2f6fb2 0 3px,#4c86c4 3px 6px)}
.grid td.sqc{position:relative;cursor:grab;touch-action:none;user-select:none;outline:2px solid #e3a008;outline-offset:-2px;font-weight:700}
.sqv{position:absolute;left:0;top:0;bottom:0;width:100%;background:repeating-linear-gradient(45deg,#2f6fb2 0 3px,#4c86c4 3px 6px);border-right:1px solid #fff;box-shadow:3px 0 4px rgba(0,0,0,.4)}
.grid td.sqh{color:#b26a00;font-weight:700}
/* table-mode baccarat (felt) */
#felt{flex:1;min-height:0;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#1b7a4f,#0c4a30 75%);color:#f3f3f3;font:12px/1.3 var(--ui);padding:8px 10px 12px}
#felt[hidden]{display:none}
.f-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.f-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.f-top .f-tag{background:rgba(0,0,0,.3);padding:2px 8px;border-radius:10px;font-family:var(--num)}
.f-top .f-me{margin-left:auto;font-weight:700}
.f-top .pos{color:#7ee2a8} .f-top .neg{color:#ff9b94}
.f-roads{display:flex;flex-wrap:wrap;gap:6px;background:#fff;border-radius:4px;padding:4px}
.road6{display:grid;grid-template-rows:repeat(6,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:1px;background:#e3e6ea;border:1px solid #e3e6ea;flex:none}
.road6 i{background:#fff;position:relative;display:block}
.bead i b{position:absolute;inset:1px;border-radius:50%;color:#fff;font:700 8px/12px var(--ui);text-align:center;font-style:normal}
.bead .P b{background:#1d5fa8}.bead .B b{background:#c8102e}.bead .T b{background:#2f7d46}
.big i b{position:absolute;inset:2px;border-radius:50%;border:2px solid}
.big .P b{border-color:#1d5fa8}.big .B b{border-color:#c8102e}
.big i s{position:absolute;left:50%;top:-1px;bottom:-1px;width:2px;background:#2f7d46;transform:rotate(45deg)}
.big i u{position:absolute;right:0;bottom:-2px;font:700 7px var(--ui);color:#2f7d46;text-decoration:none}
.f-cards{display:flex;gap:10px}
.f-side{flex:1;border:2px solid rgba(255,255,255,.35);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px}
.f-side.f-P{border-color:#5b9be6}.f-side.f-B{border-color:#ef6b6b}
.f-side.win{box-shadow:0 0 0 3px #ffd43b,0 0 18px rgba(255,212,59,.6)}
.f-sh{display:flex;gap:8px;align-items:center;font-weight:700;letter-spacing:.06em}
.f-sc{min-width:26px;text-align:center;background:#fff;color:#111;border-radius:12px;padding:0 6px;font-family:var(--num)}
.f-row{display:flex;gap:5px;align-items:center;min-height:70px}
.f-slot{width:48px;height:67px;border:1px dashed rgba(255,255,255,.35);border-radius:4px}
.f-row .third{transform:rotate(90deg);margin-inline:10px}
.f-row .lv{outline:3px solid #ffd43b;outline-offset:1px;animation:lv 1s ease-in-out infinite}
@keyframes lv{50%{outline-color:rgba(255,212,59,.3)}}
.f-res{text-align:center;font:700 18px var(--ui);letter-spacing:.08em;padding:3px;border-radius:6px;background:rgba(0,0,0,.35)}
.f-res.f-P{color:#8fc1ff}.f-res.f-B{color:#ff9b94}.f-res.f-T{color:#8be0a8}
.f-res.new{animation:pulse 1.2s ease-out}

<script>
(() => {
const PREFIX = "xlsheet-sb-";
const EVT_NAME = "성호", EVT_MS = 10000, EVT_MAX = 50000000, EVT_BILLS = [10000, 50000, 100000, 300000, 500000, 1000000, 3000000];
const START = 1000000, MAX = 10, AMTS = [10000, 50000, 100000, 500000, 1000000, 10000000], NROWS = 60;
/* event alerts: tune these to change what counts as "special" */
const EV_ALLIN_MIN = 100000;   // all-in win only announced when the stake was at least this
const EV_BIG = 2000000;        // net win >= this → "대박"
const EV_JACKPOT = 10000000;   // net win >= this → "잭팟"
const EV_SPECIAL_MIN = 100000; // stake needed for tie / straight-up / blackjack call-outs
const GNAME = { bac: "바카라", rl: "룰렛", bj: "블랙잭", hd: "홀덤", sk: "주식", pk: "빠칭코", sl: "슬롯", to: "토토" };
const SB = 5000, BB = 10000, TURN_MS = 30000, NEXT_MS = 5000;
const GAMES = ["bac", "rl", "bj", "hd"];
const VIEWS = {
  bac:   [34, 62, 30, 40, 40, 44, 50, 62, 66, 52],
  rl:    [30, 24, 24, 24, 24, 24, 24, 24, 24, 24, 24, 24, 24, 34],
  bj:    [52, 56, 38, 38, 38, 38, 38, 36, 50, 56],
  hd:    [58, 64, 38, 38, 38, 38, 42, 50, 62, 58],
  pk: [40, ...Array(19).fill(19)],
  sl: [24, ...Array(5).fill([20, 20, 20, 3]).flat()],
  to: [36, ...Array(21).fill(16)],
  decoy: [44, 62, 70, 34, 44, 50, 50, 66],
  ch: [34, 34, 34, 34, 34, 34, 34, 34, 34],
  om: [26, ...Array(15).fill(24)],
  c4: [34, ...Array(7).fill(42)],
  tw: [26, ...Array(21).fill(18)],
  rd: [26, ...Array(14).fill(48)],
  sk: [62, 96, 80, 70, 62, 104, 54, 78, 86, 62, 52, 52],
  rk: [34, 70, 84, 96, 116, 84],
  cfg: [84, 96, 110, 260],
};
/* settings (per viewer): normal = real game names instead of the spreadsheet disguise, table = felt baccarat */
let MODE = { normal: false, table: false };
try { Object.assign(MODE, JSON.parse(localStorage.getItem("xs-mode")) || {}); } catch {}
const NTAB = { bac: "바카라", rl: "룰렛", bj: "블랙잭", hd: "홀덤", pk: "빠칭코", sl: "슬롯", to: "토토", sk: "주식", ch: "체스", om: "오목", c4: "사목", tw: "탑쌓기", rd: "랜덤디펜스", rk: "랭킹", cfg: "설정", decoy: "품목마스터" };
const NRULE = [
  [/^2026 4Q 자재 집계$/, () => NTAB[view] || "카지노"], [/^2026 4Q 담당자 실적평가$/, "랭킹"],
  [/^BOM 대조표 \(L1\)$/, "체스"], [/^검수내역 대조$/, "오목"], [/^이월 정리$/, "사목 (4목)"], [/^적재 누계 \(L2\)$/, "탑 쌓기"],
  [/전표코드/, "방"], [/(\d+)전표/, "$1판"], [/■ 분석/, "■ 통계"], [/담당자/g, "플레이어"], [/^담당$/, "플레이어"],
  [/^잔액$/, "칩"], [/^최고잔액$/, "최고칩"], [/^계좌$/, "자산"], [/^추이$/, "출목"], [/^검토:/, "홀덤:"], [/^비고 입력 후 Enter$/, "채팅 입력 후 Enter"],
];
const NM = t => typeof t !== "string" || !MODE.normal ? t : NRULE.reduce((s, [re, to]) => s.replace(re, to), t);
const DEF_F = () => MODE.normal ? "" : "=SUMIFS(재고!C:C,재고!A:A,$A4)";
const $ = id => document.getElementById(id);
const grid = $("grid"), formula = $("formula");
const fmt = n => Math.round(n).toLocaleString("ko-KR");
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));
const man = n => n >= 10000 && n % 10000 === 0 ? n / 10000 + "만" : fmt(n);
const code5 = n => "ST-" + String(n).padStart(5, "0");
const netCls = n => "n " + (n > 0 ? "in" : n < 0 ? "out" : "");

function say(text, err) {
  formula.textContent = NM(text); formula.classList.toggle("err", !!err);
  clearTimeout(say.t);
  say.t = setTimeout(() => { formula.textContent = DEF_F(); formula.classList.remove("err"); }, 3500);
}

/* ---------- cards: 0–51, rank = n%13+1, suit = n/13 ---------- */
const rnd = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; };
const draw = () => rnd() % 52;
const rank = c => c % 13 + 1;

/* basic strategy for one hand without splitting: returns a hint string */
function bjHint(cs, up) {
  let s = 0, ace = false;
  for (const c of cs) { const r = Math.min(rank(c), 10); s += r; if (r === 1) ace = true; }
  const soft = ace && s + 10 <= 21, v = soft ? s + 10 : s;
  const u = Math.min(rank(up), 10) === 1 ? 11 : Math.min(rank(up), 10);
  const two = cs.length === 2;
  const dbl = (cond, alt) => cond ? (two ? "더블" : alt) : alt;
  if (soft) {
    if (v >= 19) return "스탠드";
    if (v === 18) return u >= 3 && u <= 6 ? dbl(true, "스탠드") : u <= 8 ? "스탠드" : "히트";
    if (v === 17) return dbl(u >= 3 && u <= 6, "히트");
    if (v >= 15) return dbl(u >= 4 && u <= 6, "히트");
    return dbl(u >= 5 && u <= 6, "히트");
  }
  if (v >= 17) return "스탠드";
  if (v >= 13) return u <= 6 ? "스탠드" : "히트";
  if (v === 12) return u >= 4 && u <= 6 ? "스탠드" : "히트";
  if (v === 11) return dbl(u <= 10, "히트");
  if (v === 10) return dbl(u <= 9, "히트");
  if (v === 9) return dbl(u >= 3 && u <= 6, "히트");
  return "히트";
}
